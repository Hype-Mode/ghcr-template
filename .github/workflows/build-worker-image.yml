name: Build Worker Image

on:
  push:
    branches: [main]
    tags: ['worker-v*']
    paths:
      - 'worker/**'
      - '.github/workflows/build-worker-image.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/build-worker-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase namespace; org/user names are not.
      - name: Resolve image name
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/comfyranch-comfyui" >> "$GITHUB_OUTPUT"
          echo "Publishing to ghcr.io/${owner}/comfyranch-comfyui"

      # The image is large (CUDA + PyTorch + ComfyUI); reclaim runner disk first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=match,pattern=worker-v(.*),group=1

      - uses: docker/build-push-action@v6
        with:
          context: worker
          file: worker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
